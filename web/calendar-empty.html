<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Calendario — CineEnCasa</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0">
  <link rel="stylesheet" href="css/material-tokens.css">
  <link rel="stylesheet" href="css/calendar-empty.css">
</head>
<body>
  <header class="app-header">
    <div class="app-header__inner">
      <a href="calendar.html?logged=1" class="brand">
        <img src="assets/d3d3d.svg" alt="" class="brand-icon"/>
        <span class="brand-title">CineEnCasa</span>
      </a>
      <div class="header-actions">
        <a href="notification-preferences.html?logged=1" title="Preferencias de notificación">
          <span class="material-symbols-outlined header-icon" aria-label="Preferencias de notificación">notifications</span>
        </a>
        <a href="profile.html?logged=1" title="Perfil">
          <span class="material-symbols-outlined header-icon" aria-label="Perfil">account_circle</span>
        </a>
      </div>
    </div>
  </header>
  <main class="empty-page">
    <div class="empty-content">
      <svg class="empty-icon" viewBox="0 0 150 150" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <rect x="1" y="1" width="148" height="148" stroke="#94A3B8"/>
        <line x1="1" y1="1" x2="149" y2="149" stroke="#94A3B8"/>
        <line x1="149" y1="1" x2="1" y2="149" stroke="#94A3B8"/>
      </svg>
      <h1>Tu calendario está vacío</h1>
      <p>Aquí verás los estrenos que sigues, ordenados por fecha. Para seguir una película nueva, usa la app móvil CineEnCasa.</p>
    </div>
  </main>

  <script src="js/calendar-empty.js"></script>
</body>
</html>
