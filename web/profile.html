<!doctype html>
<html lang="es">
<head>

  <meta name="viewport" content="width=device-width,initial-scale=1" />

  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0">
  <link rel="stylesheet" href="css/material-tokens.css">
  <link rel="stylesheet" href="css/profile.css">
</head>
<body>
  <header class="app-header">
    <div class="app-header__inner">
      <a href="calendar.html?logged=1" class="brand">

      <div class="header-actions">

    </div>

  <main class="profile-page">
    <h1>Perfil</h1>

    <p class="section-label">Datos</p>

      <p>Nombre: Daniela Torres</p>
      <p>Correo: daniela.torres@correo.com</p>

      <span class="chip-pill">Netflix</span>
      <span class="chip-pill">HBO Max</span>
