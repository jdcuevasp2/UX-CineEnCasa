<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Cancelar alarma — CineEnCasa</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0">
  <link rel="stylesheet" href="css/material-tokens.css">
  <link rel="stylesheet" href="css/cancel-alarm.css">
</head>
<body>
  <header class="app-header">
    <div class="app-header__inner">
      <a href="calendar.html?logged=1" class="brand">
        <img src="assets/d3d3d.svg" alt="" class="brand-icon"/>
        <span class="brand-title">CineEnCasa</span>
      </a>
      <div class="header-actions">
        <span class="material-symbols-outlined header-icon" aria-hidden="true">notifications</span>
        <a href="#" id="logoutBtn" title="Cerrar sesión">
          <span class="material-symbols-outlined header-icon" aria-label="Cerrar sesión">account_circle</span>
        </a>
      </div>
    </div>
  </header>
  <main class="cancel-alarm-page">
    <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="cancelTitle" aria-describedby="cancelDesc">
      <div class="modal-body">
        <h1 id="cancelTitle" class="modal-title">¿Cancelar tu alarma para «Toy Story 5»?</h1>
        <p id="cancelDesc" class="modal-desc">Dejará de aparecer en tu calendario y no recibirás avisos. Puedes volver a crearla desde la app móvil.</p>
      </div>
      <div class="modal-actions">
        <button type="button" id="noBtn" class="btn btn-text">NO</button>
        <button type="button" id="yesBtn" class="btn btn-text">SÍ, CANCELAR</button>
      </div>
    </div>
  </main>
  <script src="js/cancel-alarm.js"></script>
</body>
</html>
