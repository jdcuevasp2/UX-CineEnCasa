<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Preferencias de aviso — CineEnCasa</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0">
  <link rel="stylesheet" href="css/material-tokens.css">
  <link rel="stylesheet" href="css/notification-preferences.css">
</head>
<body>
  <header class="app-header">
    <div class="app-header__inner">
      <a href="calendar.html?logged=1" class="brand">
        <img src="assets/d3d3d.svg" alt="" class="brand-icon"/>
        <span class="brand-title">CineEnCasa</span>
      </a>
      <div class="header-actions">
        <a href="notification-preferences.html?logged=1" title="Preferencias de notificación">
          <span class="material-symbols-outlined header-icon" aria-label="Preferencias de notificación">notifications</span>
        </a>
        <a href="profile.html?logged=1" title="Perfil">
          <span class="material-symbols-outlined header-icon" aria-label="Perfil">account_circle</span>
        </a>
      </div>
    </div>
  </header>
  <main class="prefs-page">
    <h1>Preferencias de aviso</h1>
    <p class="prefs-subtitle">Elige qué avisos quieres recibir para cada estreno que sigues</p>

    <div class="pref-row">
      <span class="pref-label">Aviso 1 semana antes</span>
      <label class="switch">
        <input type="checkbox" checked />
        <span class="switch-track"><span class="switch-thumb"></span></span>
      </label>
    </div>
    <hr class="divider">

    <div class="pref-row">
      <span class="pref-label">Aviso 1 día antes</span>
      <label class="switch">
        <input type="checkbox" checked />
        <span class="switch-track"><span class="switch-thumb"></span></span>
      </label>
    </div>
    <hr class="divider">

    <div class="pref-row">
      <span class="pref-label">Aviso 1 hora antes</span>
      <label class="switch">
        <input type="checkbox" checked />
        <span class="switch-track"><span class="switch-thumb"></span></span>
      </label>
    </div>
    <hr class="divider">

    <p class="prefs-note">El aviso de 1 hora antes incluye la plataforma exacta donde quedó disponible.</p>

    <button id="saveBtn" class="btn-primary">GUARDAR</button>
    <p id="savedMsg" class="prefs-saved" hidden>Preferencias guardadas.</p>
  </main>

  <script src="js/notification-preferences.js"></script>
</body>
</html>
